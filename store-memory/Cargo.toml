# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-store-memory"
version = "1.5.0"
publish = false            # a first-party plugin crate; shipped linked into busbar or as a signed tarball
edition = "2021"
rust-version = "1.97"
description = "The default in-memory (RAM) backend for busbar's durable governance store — ephemeral, zero-setup."
license = "Apache-2.0"

[lib]
# rlib: the LINKED door (`door`, the store v3 table), which a busbar build names as a compiled-in
# row. The dropped-in door is the sibling `busbar-store-memory-plugin` cdylib, which exports this
# same door as its one symbol; this crate exports none.
crate-type = ["rlib"]

[dependencies]
# The ONE busbar crate a plugin names. Pinned by git rev to the busbar commit in `.busbar-ref`.
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "ad5348c785fdf6466a8ff6a831133115fc1089f9" }

[dev-dependencies]
# The `Store` contract conformance suites live in this crate's own tests (no shared test util
# between plugins); they serialise typed rows into the opaque record body exactly as core does.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
