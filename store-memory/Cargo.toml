[package]
name = "busbar-store-memory"
version = "1.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The in-memory (RAM) backend for busbar's governance store — ephemeral, zero-setup."

[lints]
workspace = true

[lib]
# rlib: the LINKED door (a busbar build holds this crate's store v3 `door` as its compiled-in row,
# `linked::STORE`). The DROPPED-IN door is the sibling `busbar-store-memory-plugin` cdylib, which
# holds the one `export_door!`; this crate stays `forbid(unsafe_code)` and defines no door symbol.
crate-type = ["rlib"]

# DEPENDENCY POLICY. A plugin's busbar closure is busbar-contract and nothing else; third-party crates
# come from the workspace table (`{ workspace = true }`), which is busbar's dependency policy.
[dependencies]
# The record half of the store protocol. `busbar_contract::abi::sdk::store::StoreSlots` declares
# `record_put`, `record_get` and `record_scan` for a plane's kernel-held durable records, and this
# backend answers them at the contract's own spelling. busbar-contract is the ONE busbar crate a
# plugin names, pinned by git rev to the busbar commit in `.busbar-ref` (the workspace row).
busbar-contract = { workspace = true }
# The dedupe log keeps a SHA-256 digest of each op's value fields, never their text, so what it
# holds per op is fixed size. Already in busbar-contract's own closure: no crate is added.
sha2 = { workspace = true }
# The store takes no settings; `validate`/`open` parse them only to refuse malformed JSON and keys.
serde_json = { workspace = true }

[dev-dependencies]
# The `Store` contract conformance suites live in this crate's own tests (no shared test util
# between plugins); they serialise typed rows into the opaque `PlaneRecord` body exactly as core
# does, which is the whole of what they need from serde.
# The store kind's shared epoch and slice-life cases (`busbar_contract::testkit::store_v3`), which
# every store runs; the test kit is dev-only (`test-seal`: no test kit ships).
busbar-contract = { workspace = true, features = ["test-seal"] }
serde = { workspace = true }
