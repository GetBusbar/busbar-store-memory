# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-store-memory"
version = "1.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The ephemeral in-memory backend for neutral Store persistence primitives."

[lints]
workspace = true

[lib]
# The logic crate exposes the same primitive door used by linked registration;
# the sibling cdylib owns the single exported plugin symbol.
crate-type = ["rlib"]

# DEPENDENCY POLICY. A plugin's busbar closure is busbar-contract and nothing else; third-party crates
# come from the workspace table (`{ workspace = true }`), which is busbar's dependency policy.
[dependencies]
# Runtime dependency stays neutral: the contract only, with no kernel/loader edge.
busbar-contract = { workspace = true }
# Lifecycle settings carry only an explicit native input allocation budget.
serde_json = { workspace = true }
zeroize = { workspace = true }
getrandom = { workspace = true }

[dev-dependencies]
jsonschema = { workspace = true }

# Owner test sources consumed only by the assembly test harness.
[package.metadata.busbar.test-sources]
root = "tests/root/mod.rs"
