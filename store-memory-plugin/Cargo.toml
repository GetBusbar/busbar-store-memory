# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-store-memory-plugin"
version = "1.5.0"
publish = false            # first-party signed cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.97"
description = "First-party signed kind:store plugin cdylib: the in-memory governance store, packaged as a droppable busbar plugin exporting busbar_plugin_door."
license = "Apache-2.0"

[lib]
# cdylib: the DROPPED-IN door (a signed tarball in `plugins/`), exporting `busbar_plugin_door`.
# rlib: what `cargo test` links, and what makes it emit the cdylib the conformance test loads.
crate-type = ["cdylib", "rlib"]

[dependencies]
# THE LOGIC, same repo: its `door` is the door this image exports.
busbar-store-memory = { path = "../store-memory" }
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "ad5348c785fdf6466a8ff6a831133115fc1089f9" }

[dev-dependencies]
# busbar's PUBLISHED conformance suite (`tests/conformance.rs`): it loads the linked door and dlopens
# the built cdylib over the REAL loader, and drives both as the kernel drives a store.
busbar-plugin-loader = { git = "https://github.com/GetBusbar/busbar", rev = "ad5348c785fdf6466a8ff6a831133115fc1089f9", features = ["conformance"] }
