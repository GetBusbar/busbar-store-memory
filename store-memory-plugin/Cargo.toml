# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-store-memory-plugin"
version = "1.5.0"
publish = false            # first-party signed cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.97"
description = "First-party signed kind:store plugin cdylib: the in-memory governance store, packaged as a droppable busbar plugin exporting busbar_plugin_door."
license = "Apache-2.0"

[lib]
# cdylib: the DROPPED-IN door (a signed tarball in `plugins/`), exporting `busbar_plugin_door`.
# rlib: what `cargo test` links, and what makes it emit the cdylib the conformance test loads.
crate-type = ["cdylib", "rlib"]

[features]
# THE DROPPED-IN DOOR: `export_door!` emits the one C symbol `busbar_plugin_door`, and ONLY the
# dropped-in cdylib may export it (compiled in = dropped in, one table: a busbar build that links
# this crate as a row, alone or beside others, must carry no door symbol, or two doors in one
# binary multiply define it under `lto = "fat"`). OFF by default; the dropped-in artifact is built
# `cargo build --release -p busbar-store-memory-plugin --features dropped-in`, and `cargo test` names this crate
# below with it on so the cdylib the conformance test opens carries the door.
dropped-in = []
# M6: THE LEGACY COLD DOOR, the cold store ABI's frozen symbols (`BUSBAR_COLD_ENTRY` and the cdylib's
# `busbar_*`) through `export_store_plugin!`. busbar's plugin-loader names this crate with it on, as the
# cold lane's store image, until M6 deletes the cold ABI (TODO M6 COLD-DELETE); production never loads it.
cold-dropped-in = []

[dependencies]
# THE LOGIC, same repo: its `door` is the door this image exports.
busbar-store-memory = { path = "../store-memory" }
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "a64bca010f23743793e44655275c4e6c0b96adcc" }

[dev-dependencies]
# The conformance test opens this crate's own cdylib WITH its dropped-in door on (see `[features]`).
busbar-store-memory-plugin = { path = ".", features = ["dropped-in"] }
# The conformance test loads the linked door and dlopens the built cdylib over the REAL loader.
busbar-plugin-loader = { git = "https://github.com/GetBusbar/busbar", rev = "a64bca010f23743793e44655275c4e6c0b96adcc" }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
