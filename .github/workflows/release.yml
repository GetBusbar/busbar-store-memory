# RENDERED by `cargo xtask fleet render busbar-store-memory` from GetBusbar/busbar's plugins.yaml and
# .github/fleet/ templates; `cargo xtask fleet check` is red on any edit here. On a v* tag: this
# repo's CI on the tagged commit, then busbar's plugin-release.yml (build, sign, pack, publish), then
# the consumer verification of what was published, each at the busbar commit this repo pins.
name: release

on:
  push:
    tags: ["v*", "!v*-*"]
  # A tag pushed with GITHUB_TOKEN starts no workflow, so a workflow that tags dispatches this on
  # the tag ref (`gh workflow run release.yml --ref <tag>`).
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  attestations: write
  issues: write
  actions: read

jobs:
  ci:
    uses: GetBusbar/busbar/.github/workflows/plugin-ci.yml@ad5348c785fdf6466a8ff6a831133115fc1089f9
    with:
      service: none
      busbar_checkout: false
      macos_test: "cargo test --workspace --locked"
      extra_test: ""
    secrets: inherit
  release:
    needs: ci
    uses: GetBusbar/busbar/.github/workflows/plugin-release.yml@ad5348c785fdf6466a8ff6a831133115fc1089f9
    with:
      plugin_crate: busbar-store-memory-plugin
      manifest_name: busbar-store-memory
      plugin_alias: memory
      plugin_kind: store
      asset_prefix: busbar-store-memory
      description: "First-party signed kind:store plugin cdylib: the in-memory store, packaged as a droppable busbar plugin. Drop the signed tarball into plugins/."
      lib_only: false
      needs_prompt: ""
      needs_user: ""
      declares_file: "store-memory/declares.json"
    secrets: inherit
  consumer-verify:
    needs: release
    if: ${{ !cancelled() }}
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@ad5348c785fdf6466a8ff6a831133115fc1089f9
    with:
      version: ${{ github.ref_name }}
      asset_prefix: busbar-store-memory
      plugin_name: busbar-store-memory
      plugin_alias: memory
      plugin_kind: store
      bundle_image: ""
      bundle_env: ""
    secrets: inherit
